name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.5.7"
  # The renderer depends on Playwright; CI never needs the browsers.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  lint-ts:
    name: lint (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            api/package-lock.json
            analyzer/package-lock.json
            renderer/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix shared
          npm ci --prefix api
          npm ci --prefix analyzer
          npm ci --prefix renderer

      # api, analyzer and renderer import @shieldeye/shared from its dist/ output.
      - name: Build shared
        run: npm run build --prefix shared

      # Each service has its own eslint.config.js, so ESLint has to run from
      # inside the service directory.
      - name: ESLint
        run: |
          (cd api && npx --no-install eslint .)
          (cd analyzer && npx --no-install eslint .)

      - name: Typecheck
        run: |
          (cd api && npx --no-install tsc --noEmit)
          (cd analyzer && npx --no-install tsc --noEmit)
          (cd renderer && npx --no-install tsc --noEmit)

  lint-python:
    name: lint (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: python -m pip install "ruff==${RUFF_VERSION}" bandit

      - name: Ruff
        run: ruff check .

      # Gates on high-severity findings only.
      - name: Bandit
        run: bandit -r gtk_gui_pro tests/python --severity-level high

  test-ts:
    name: test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 18 is what the service Dockerfiles run on.
        node-version: [18, 20, 22]
    services:
      # Throwaway database for api/src/__tests__/vulnerability-cache.concurrent.test.ts.
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: shieldeye
          POSTGRES_USER: shieldeye
          POSTGRES_PASSWORD: shieldeye_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U shieldeye"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql://shieldeye:shieldeye_dev@localhost:55432/shieldeye
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            api/package-lock.json
            analyzer/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix shared
          npm ci --prefix api
          npm ci --prefix analyzer

      - name: Build shared
        run: npm run build --prefix shared

      # The API creates its tables on startup; do the same for the test database.
      - name: Create database schema
        working-directory: api
        env:
          DATABASE_URL: ${{ env.INTEGRATION_DATABASE_URL }}
          TLS_ENABLED: "false"
        run: >-
          npx --no-install ts-node --transpile-only -e
          "const { Database } = require('./src/database');
          new Database().initialize()
          .then(() => process.exit(0))
          .catch((err) => { console.error(err); process.exit(1); });"

      - name: Test api
        run: npm test --prefix api -- --ci --coverage --coverageReporters=text-summary

      - name: Test analyzer
        run: npm test --prefix analyzer -- --ci --coverage --coverageReporters=text-summary

  test-python:
    name: test (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install requests pytest

      # The other scripts in tests/python are manual stress and diagnostic
      # checks against a running stack, so CI only runs the smoke tests.
      - name: Smoke tests
        run: python -m pytest tests/python/smoke -v

  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: .
          - service: analyzer
            context: .
          - service: renderer
            context: .
          - service: frontend
            context: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate compose files
        if: matrix.service == 'api'
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.service }}/Dockerfile
          push: false
          tags: shieldeye-surfacescan-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
